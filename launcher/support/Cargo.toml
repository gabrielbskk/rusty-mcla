# Support features of the Rusty MCLA launcher: Export Logs (redaction, system information, zip), the save manager and starting the game.
# No Tauri here, so everything is unit-tested with temporary folders.
[package]
name = "mcla-support"
version = "0.1.0"
edition = "2021"
description = "Rusty MCLA support tools (Export Logs, save manager, game start)"
license = "GPL-3.0-only"
publish = false

[lib]
name = "mcla_support"
path = "src/lib.rs"

[dependencies]
mcla-install = { path = "../../mcla-rs/crates/install" }
mcla-config = { path = "../../mcla-rs/crates/config" }
mcla-savedecode = { path = "../../mcla-rs/crates/savedecode" }
mcla-updater = { path = "../updater" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
log = "0.4"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
serde_json = { version = "1", features = ["float_roundtrip"] }
