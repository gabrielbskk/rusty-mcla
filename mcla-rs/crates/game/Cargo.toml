[package]
name = "mcla"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mcla"
path = "src/main.rs"

# Android NativeActivity loads this library; the desktop executable keeps its
# existing entry point in the same source file.
[lib]
name = "mcla_android"
path = "src/main.rs"
crate-type = ["cdylib"]

[dependencies]
mcla-formats = { path = "../formats" }
mcla-flash = { path = "../flash" }
mcla-config = { path = "../config" }
mcla-shaders = { path = "../shaders" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
memmap2.workspace = true
rayon.workspace = true
glam.workspace = true
bytemuck.workspace = true
hashbrown.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu = "24"
winit = { version = "0.30", features = ["android-native-activity"] }
pollster = "0.4"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = { version = "0.31", default-features = false, features = ["links"] }
png = "0.17"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# SDL's desktop controller backend needs its own Android Activity. Mobile input
# is handled separately, so do not link that backend into NativeActivity.
sdl3-sys = { version = "0.7", default-features = false, features = ["build-from-source-static", "no-default-subsystems", "sdl-joystick", "sdl-audio", "sdl-haptic", "sdl-hidapi", "sdl-sensor"] }
